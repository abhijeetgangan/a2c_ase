name: Docs

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[docs]"
          uv pip install mace-torch

      - name: Install Jupyter kernel
        run: |
          uv run python -m ipykernel install --user --name a2c_ase --display-name "Python (a2c_ase)"

      - name: Convert and execute Si64.py
        run: |
          uv run jupytext --to notebook --execute --set-kernel a2c_ase example/Si64.py -o docs/examples/Si64.ipynb
        env:
          CI: "true"

      - name: Convert and execute hull.py
        run: |
          uv run jupytext --to notebook --execute --set-kernel a2c_ase example/hull.py -o docs/examples/hull.ipynb
        env:
          CI: "true"

      - name: Convert and execute cell_extraction.py
        run: |
          uv run jupytext --to notebook --execute --set-kernel a2c_ase example/cell_extraction.py -o docs/examples/cell_extraction.ipynb
        env:
          CI: "true"

      - name: Build docs
        run: uv run mkdocs build --strict

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: uv run mkdocs gh-deploy --force
